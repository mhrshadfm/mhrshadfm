.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:1}40%{opacity:.15}60%{opacity:.9}}
@keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(160px)}}
.blink{animation:blink 1.1s steps(1,end) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.scan{animation:scan 7s linear infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
