<text x="330" y="362" font-size="11" fill="#7fb0ff">Electron · Node.js · Windows 11 / macOS UI</text>
<text x="330" y="383" font-size="11.5" fill="#7482ad">Multi-account isolated application runner with sandboxed cookie/session storage and</text>
