<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Production ecosystem: Viral Studio, FuY.Land, OSINT-Sentinel, Spaces, Silk Road Core">
<title>Production ecosystem: Viral Studio, FuY.Land, OSINT-Sentinel, Spaces, Silk Road Core</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes twinkle{0%,100%{opacity:1}40%{opacity:.15}60%{opacity:.9}}
@keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(580px)}}
.blink{animation:blink 1.1s steps(1,end) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.scan{animation:scan 7s linear infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="1" stop-color="#04050a"/></linearGradient>
<pattern id="scanP" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".025"/></pattern>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff" stop-opacity="0"/><stop offset=".85" stop-color="#2f6bff" stop-opacity=".07"/><stop offset="1" stop-color="#7fb0ff" stop-opacity=".22"/></linearGradient>
<clipPath id="cardClip"><rect width="1000" height="540" rx="14"/></clipPath>
</defs>
<rect width="1000" height="540" rx="14" fill="url(#bgG)"/>
<g clip-path="url(#cardClip)"><rect width="1000" height="540" fill="url(#scanP)"/>
